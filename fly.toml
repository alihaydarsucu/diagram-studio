# fly.toml app configuration file generated for rough-morning-3060 on 2026-08-07T13:04:12+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'diagram-studio'
primary_region = 'ams'

[build]

[env]
  DIAGRAM_STUDIO_AUTH_USER = 'Ali Haydar'
  DIAGRAM_STUDIO_DATA_DIR = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[mounts]]
  source = 'diagram_data'
  destination = '/data'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
